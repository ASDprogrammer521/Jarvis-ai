name: Build Windows EXE + Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1). Leave empty to only build artifact."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -U pip wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build with PyInstaller
        run: python -m PyInstaller Jarvis.spec --noconfirm --clean

      - name: Package zip
        shell: pwsh
        run: |
          $ver = "1.0.0"
          if (Test-Path "VERSION") { $ver = (Get-Content VERSION -Raw).Trim() }
          if ($env:GITHUB_REF -match 'refs/tags/v(.+)') { $ver = $Matches[1] }
          $name = "Jarvis-Windows-x64-v$ver.zip"
          if (Test-Path $name) { Remove-Item $name -Force }
          Compress-Archive -Path "dist\Jarvis\*" -DestinationPath $name -Force
          echo "ZIP_NAME=$name" >> $env:GITHUB_ENV
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          Get-Item $name | Format-List Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-x64
          path: Jarvis-Windows-x64-v*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          name: Jarvis ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          body: |
            ## Jarvis AI — Windows build
            **Python o'rnatish shart emas.**

            1. `Jarvis-Windows-x64-*.zip` ni yuklab oling
            2. Papkani oching (extract)
            3. `Jarvis.exe` ni ishga tushiring
            4. Birinchi marta Gemini API key so'raladi

            ### Eslatma
            - Windows SmartScreen ogohlantirishi mumkin (imzosiz build) → More info → Run anyway
            - Antivirus ba'zan PyInstaller buildlarni bloklashi mumkin
            - Android APK alohida: Releases yoki Actions

            **By ASDcuber**
          files: Jarvis-Windows-x64-v*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
