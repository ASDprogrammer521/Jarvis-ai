name: Build Jarvis App APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/JarvisApp/**"
      - ".github/workflows/build-apk.yml"
      - "app-debug.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android/JarvisApp
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || echo "Gradle build may require local setup"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-app-debug
          path: |
            android/JarvisApp/app/build/outputs/apk/debug/*.apk
            app-debug.apk
          if-no-files-found: warn
