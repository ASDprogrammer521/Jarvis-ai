name: Android release build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Configure SDK and signing
        working-directory: android/JarvisApp
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > jarvis-release.jks
          chmod 600 jarvis-release.jks
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Build signed release
        working-directory: android/JarvisApp
        env:
          JARVIS_KEYSTORE: jarvis-release.jks
          JARVIS_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-android-release
          path: android/JarvisApp/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove runner signing material
        if: always()
        run: rm -f android/JarvisApp/jarvis-release.jks
