name: Build Jarvis App APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/JarvisApp/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:  # Manual "Run workflow" button on GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
            accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        working-directory: android/JarvisApp
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android/JarvisApp
        run: |
          mkdir -p local.properties.d
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisApp-debug
          path: android/JarvisApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
