<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#05070b"/>
<title>Jarvis App</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #05070b;
    --surface: rgba(255,255,255,0.04);
    --border:  rgba(99,102,241,0.15);
    --accent:  #6366f1;
    --accent-glow: rgba(99,102,241,0.35);
    --text:    #f1f5f9;
    --muted:   #64748b;
    --green:   #22c55e;
    --gdim:    rgba(34,197,94,0.15);
    --red:     #ef4444;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    background-image: radial-gradient(circle at 50% 0%, rgba(99,102,241,0.08) 0%, transparent 60%);
  }
  
  /* Top Bar */
  .top {
    padding: 16px 20px; display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0;
    background: rgba(5,7,11,0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    animation: slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 10;
  }
  @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } }

  .brand { font-size: 16px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 0 15px var(--accent-glow); }
  .brand em { color: var(--accent); font-style: normal; }

  .status {
    display: flex; align-items: center; gap: 7px; padding: 5px 12px;
    border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .status.on { background: var(--gdim); border-color: rgba(34,197,94,0.4); color: var(--green); box-shadow: 0 0 15px rgba(34,197,94,0.2); }
  .status.off { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.3); color: var(--red); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
  .status.on .dot { background: var(--green); animation: pulseDot 2s infinite; }
  @keyframes pulseDot { 0%,100%{transform: scale(1); opacity:1} 50%{transform: scale(1.4); opacity:0.5} }

  /* Main Container */
  .main { 
    flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; 
    overflow-y: auto; scroll-behavior: smooth; 
  }
  .main::-webkit-scrollbar { width: 4px; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px; backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popUp { from { opacity:0; transform:translateY(10px) scale(0.97); } }
  
  .card h3 { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; font-weight: 700; }

  /* Inputs & Buttons */
  input, button { font: inherit; border: none; outline: none; }
  input {
    width: 100%; background: rgba(255,255,255,0.03); color: var(--text); border-radius: 12px;
    padding: 12px 16px; border: 1.5px solid var(--border); margin-bottom: 10px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); background: rgba(255,255,255,0.06); }
  input::placeholder { color: var(--muted); }

  .btn { 
    width: 100%; padding: 12px 18px; border-radius: 12px; font-size: 11px; font-weight: 700; 
    letter-spacing: 1.5px; cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
  }
  .btn:active { transform: scale(0.96); }
  .btn:hover  { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 0 15px var(--accent-glow); }
  .btn-primary:hover { background: #4f46e5; box-shadow: 0 0 25px var(--accent-glow); }

  .btn-ghost { background: rgba(255,255,255,0.04); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,0.08); }

  .btn-danger { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
  .btn-danger:hover { background: rgba(239,68,68,0.2); box-shadow: 0 0 15px rgba(239,68,68,0.3); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  
  /* Log Box */
  .log {
    flex: 1; min-height: 120px; max-height: 40vh; overflow-y: auto;
    font-size: 13px; line-height: 1.6; color: var(--muted); white-space: pre-wrap;
    font-family: monospace;
  }

  /* Footer Ask Bar */
  .ask {
    display: flex; gap: 10px; padding: 14px 20px 20px; flex-shrink: 0;
    background: rgba(5,7,11,0.85); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border); box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 10;
  }
  @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } }

  .ask input { margin: 0; flex: 1; }
  .ask button { 
    width: 48px; height: 48px; border-radius: 12px; background: var(--accent); color: #fff; 
    font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 0 15px var(--accent-glow); flex-shrink: 0; transition: all 0.25s;
  }
  .ask button:hover { background: #4f46e5; box-shadow: 0 0 25px var(--accent-glow); transform: translateY(-2px); }
  .ask button:active { transform: scale(0.94); }

  .hint { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><em>J</em>ARVIS</div>
    <div id="st" class="status off"><span class="dot"></span>Offline</div>
  </div>
  <div class="main">
    <div class="card" id="connectCard">
      <h3>CONNECT TO PC</h3>
      <input id="host" placeholder="PC IP e.g. 192.168.35.70" autocomplete="off"/>
      <input id="key" placeholder="Pairing key from Dashboard" autocomplete="off"/>
      <button class="btn btn-primary" id="connectBtn" onclick="connect()">CONNECT</button>
      <p class="hint">
        Use <b>http</b> (not https). Same Wi‑Fi required.<br/>
        Get a <b>fresh</b> key from Jarvis → Remote Control each time.
      </p>
    </div>
    <div class="card" id="ctrlCard" style="display:none">
      <h3>QUICK ACTIONS</h3>
      <div class="grid">
        <button class="btn btn-ghost" onclick="sendCmd('status')">Status</button>
        <button class="btn btn-ghost" onclick="sendCmd('what can you do')">Help</button>
        <button class="btn btn-ghost" onclick="sendCmd('mute')">Mute</button>
        <button class="btn btn-ghost" onclick="sendCmd('unmute')">Unmute</button>
      </div>
      <button class="btn btn-danger" style="margin-top:10px" onclick="disconnect()">DISCONNECT</button>
    </div>
    <div class="card" style="flex:1; display:flex; flex-direction:column">
      <h3>LIVE LOG</h3>
      <div class="log" id="log"></div>
    </div>
  </div>
  <div class="ask">
    <input id="msg" placeholder="Ask anything…" onkeydown="if(event.key==='Enter')sendMsg()"/>
    <button onclick="sendMsg()">✦</button>
  </div>
<script>
let ws = null;
const $ = (id) => document.getElementById(id);
const saved = localStorage.getItem('jarvis_host') || '';
if (saved) $('host').value = saved;
if (!$('host').value && location.hostname && location.hostname !== '127.0.0.1') {
  $('host').value = location.hostname;
}

function log(line) {
  const el = $('log');
  el.textContent += '[' + new Date().toLocaleTimeString() + '] ' + line + '\n';
  el.scrollTop = el.scrollHeight;
}
function setOnline(on) {
  $('st').innerHTML = `<span class="dot"></span>${on ? 'Online' : 'Offline'}`;
  $('st').className = 'status ' + (on ? 'on' : 'off');
  $('connectCard').style.display = on ? 'none' : 'block';
  $('ctrlCard').style.display = on ? 'block' : 'none';
}

function resolveOrigin(hostVal) {
  if (location.protocol === 'http:' && location.port === '8000') {
    return location.origin;
  }
  const clean = (hostVal || '').replace(/^https?:\/\//, '').replace(/\/$/, '');
  const withPort = clean.includes(':') ? clean : (clean + ':8000');
  return 'http://' + withPort;
}

function openWs(origin, token) {
  return new Promise((resolve, reject) => {
    const u = new URL(origin);
    const url = 'ws://' + u.host + '/ws?token=' + encodeURIComponent(token);
    log('WS → ' + url.replace(/token=.*/, 'token=***'));
    const socket = new WebSocket(url);
    const timer = setTimeout(() => {
      try { socket.close(); } catch (e) {}
      reject(new Error('WebSocket timeout'));
    }, 8000);
    socket.onopen = () => { clearTimeout(timer); resolve(socket); };
    socket.onerror = () => { clearTimeout(timer); reject(new Error('WebSocket error')); };
    socket.onclose = (ev) => {
      clearTimeout(timer);
      if (socket.readyState !== WebSocket.OPEN) {
        reject(new Error('Closed code ' + (ev.code || '?')));
      }
    };
  });
}

async function connect() {
  const hostVal = $('host').value.trim();
  const pin = $('key').value.trim().toUpperCase();
  if (!hostVal || !pin) { alert('Enter PC IP and pairing key'); return; }

  $('connectBtn').disabled = true;
  $('connectBtn').textContent = 'CONNECTING…';
  const origin = resolveOrigin(hostVal);
  localStorage.setItem('jarvis_host', hostVal);
  log('Target: ' + origin);

  try {
    try {
      ws = await openWs(origin, pin);
      wireWs(ws);
      setOnline(true);
      log('Connected (direct key).');
      $('connectBtn').disabled = false;
      $('connectBtn').textContent = 'CONNECT';
      return;
    } catch (e1) {
      log('Direct key failed: ' + e1.message);
    }

    log('Trying /login …');
    const res = await fetch(origin + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: pin }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok || !data.token) {
      throw new Error(data.error || ('login HTTP ' + res.status));
    }
    log('Login OK, opening WS…');
    ws = await openWs(origin, data.token);
    wireWs(ws);
    setOnline(true);
    log('Connected (login token).');
  } catch (e) {
    log('FAILED: ' + e.message);
    log('Checklist: Jarvis running · same Wi‑Fi · http not https · NEW key · firewall 8000');
    setOnline(false);
  }
  $('connectBtn').disabled = false;
  $('connectBtn').textContent = 'CONNECT';
}

function wireWs(socket) {
  socket.onmessage = (ev) => {
    try {
      const m = JSON.parse(ev.data);
      if (m.type === 'phone_cmd') {
        handlePhoneCmd(m);
        return;
      }
      if (m.type === 'sys' || m.type === 'log' || m.type === 'status') log(m.text || m.state || JSON.stringify(m));
      else if (m.type === 'reply') log('Jarvis: ' + (m.text || ''));
      else log(JSON.stringify(m));
    } catch { log(ev.data); }
  };
  socket.onclose = () => { setOnline(false); log('Disconnected.'); };
  socket.onerror = () => log('Socket error.');
}

function handlePhoneCmd(m) {
  const act = (m.action || '').toLowerCase();
  if (act === 'notify' || act === 'message' || act === 'alert') {
    const t = m.text || 'Jarvis';
    log('Jarvis → ' + t);
    try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
    alert(t);
    return;
  }
  if (act === 'open_url' && m.url) {
    log('Open URL: ' + m.url);
    try { window.open(m.url, '_blank'); } catch (e) { location.href = m.url; }
    return;
  }
  log('Phone cmd: ' + JSON.stringify(m));
}

function disconnect() { if (ws) ws.close(); setOnline(false); }
function sendCmd(text) {
  if (!ws || ws.readyState !== 1) { log('Not connected'); return; }
  ws.send(JSON.stringify({ type: 'command', text }));
  log('You: ' + text);
}
function sendMsg() {
  const t = $('msg').value.trim();
  if (!t) return;
  $('msg').value = '';
  sendCmd(t);
}
</script>
</body>
</html>
